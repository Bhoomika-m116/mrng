{% extends 'base.html' %}

{% block title %}Practitioner Registration | Official LegalLens Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="official-card shadow-lg">
                <div class="official-card-header text-center py-3 bg-dark text-white">
                    <div class="w-100">
                        <img src="{{ url_for('static', filename='images/emblem.svg') }}" alt="Seal" width="45" height="45" class="mb-2 pulse-official-seal">
                        <h4 class="fw-bold mb-0 text-white">Practitioner Registration</h4>
                        <small class="text-secondary">Official Access to Extractive Legal Analytics</small>
                    </div>
                </div>

                <div class="official-card-body p-4">
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label fw-semibold small text-uppercase text-secondary">Username *</label>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="advocate_john">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold small text-uppercase text-secondary">Official Email *</label>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="john@lawfirm.com">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="full_name" class="form-label fw-semibold small text-uppercase text-secondary">Full Legal Name</label>
                                <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Adv. John Doe">
                            </div>
                            <div class="col-md-6">
                                <label for="organization" class="form-label fw-semibold small text-uppercase text-secondary">Bar / Chamber / Organization</label>
                                <input type="text" class="form-control" id="organization" name="organization" placeholder="High Court Bar Association">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small text-uppercase text-secondary">Master Security Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Minimum 6 characters">
                        </div>

                        <button type="submit" class="btn btn-official-gold w-100 py-2 mb-3">
                            <i class="bi bi-person-check-fill me-2"></i>Create Legal Practitioner Account
                        </button>
                    </form>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top small">
                        <span>Already registered? <a href="{{ url_for('login') }}" class="fw-semibold text-primary">Log In</a></span>
                        <a href="{{ url_for('guest_mode') }}" class="text-muted"><i class="bi bi-lightning-fill text-warning me-1"></i>Continue as Guest</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
