<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background parchment gradient -->
    <linearGradient id="docParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <!-- Gold Trim -->
    <linearGradient id="goldScanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8972E"/>
    </linearGradient>
    <!-- Laser Beam Gradient -->
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00D2FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <!-- Holographic Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes laserScanVertical {
        0% { transform: translateY(80px); opacity: 0.8; }
        50% { transform: translateY(380px); opacity: 1; }
        100% { transform: translateY(80px); opacity: 0.8; }
      }
      @keyframes floatDocument {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.4deg); }
      }
      @keyframes pulseTarget {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes streamData {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .laser-scan-group {
        animation: laserScanVertical 3.2s ease-in-out infinite;
      }
      .document-float {
        transform-origin: 250px 250px;
        animation: floatDocument 5s ease-in-out infinite;
      }
      .target-pulse {
        transform-origin: 360px 140px;
        animation: pulseTarget 2.5s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 6 12;
        animation: streamData 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Tech Blueprint Background -->
  <rect x="20" y="20" width="460" height="460" rx="24" fill="#0B192C" stroke="#1E3E62" stroke-width="2"/>
  
  <!-- Subtle Blueprint Grid Lines -->
  <line x1="60" y1="20" x2="60" y2="480" stroke="#1E3E62" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="160" y1="20" x2="160" y2="480" stroke="#1E3E62" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="340" y1="20" x2="340" y2="480" stroke="#1E3E62" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="440" y1="20" x2="440" y2="480" stroke="#1E3E62" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="20" y1="120" x2="480" y2="120" stroke="#1E3E62" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="20" y1="250" x2="480" y2="250" stroke="#1E3E62" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="20" y1="380" x2="480" y2="380" stroke="#1E3E62" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Document Body (Floating) -->
  <g class="document-float">
    <!-- Document Shadow -->
    <rect x="110" y="70" width="280" height="360" rx="12" fill="#000000" opacity="0.35" filter="url(#laserGlow)"/>

    <!-- Document Page -->
    <rect x="100" y="60" width="280" height="360" rx="12" fill="url(#docParchment)" stroke="url(#goldScanner)" stroke-width="2.5"/>

    <!-- Document Header Badge / Official Seal -->
    <circle cx="140" cy="100" r="16" fill="#0B192C" stroke="url(#goldScanner)" stroke-width="2"/>
    <path d="M140 92 L140 108 M132 98 L148 98" stroke="url(#goldScanner)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Title Line -->
    <rect x="170" y="94" width="130" height="12" rx="4" fill="#0B192C"/>
    <rect x="310" y="94" width="40" height="12" rx="4" fill="#D4AF37"/>

    <!-- Contract Clause Lines Mockup -->
    <rect x="130" y="130" width="240" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="130" y="148" width="220" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="130" y="166" width="240" height="7" rx="3.5" fill="#CBD5E1"/>
    
    <!-- High-Risk Section Clause (Red Accent Highlighted) -->
    <rect x="125" y="190" width="250" height="42" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="135" y="200" width="180" height="8" rx="4" fill="#DC2626"/>
    <rect x="135" y="216" width="140" height="7" rx="3.5" fill="#EF4444"/>
    <circle cx="355" cy="211" r="8" fill="#DC2626"/>
    <text x="355" y="215" font-family="'Inter', sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">!</text>

    <!-- Standard Clauses Lines Continued -->
    <rect x="130" y="248" width="240" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="130" y="266" width="190" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="130" y="284" width="230" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="130" y="302" width="210" height="7" rx="3.5" fill="#CBD5E1"/>

    <!-- Signature & Seal Area -->
    <path d="M130 360 Q150 340 170 355 T210 345" fill="none" stroke="#0B192C" stroke-width="2" stroke-linecap="round"/>
    <circle cx="330" cy="355" r="22" fill="#D4AF37" opacity="0.25" stroke="url(#goldScanner)" stroke-width="2"/>
    <path d="M330 343 L330 367 M320 355 L340 355" stroke="url(#goldScanner)" stroke-width="2"/>
  </g>

  <!-- Laser Beam Scanning Group (Moving up and down) -->
  <g class="laser-scan-group">
    <!-- Wide Laser Line -->
    <line x1="80" y1="0" x2="420" y2="0" stroke="url(#laserBeamGrad)" stroke-width="6" filter="url(#laserGlow)"/>
    <!-- Intense Center Line -->
    <line x1="95" y1="0" x2="405" y2="0" stroke="#FFFFFF" stroke-width="2.5"/>
    
    <!-- Laser Corner Emitter Nodes -->
    <circle cx="80" cy="0" r="6" fill="#00D2FF" filter="url(#laserGlow)"/>
    <circle cx="420" cy="0" r="6" fill="#D4AF37" filter="url(#laserGlow)"/>

    <!-- Laser Light Reflection Flare -->
    <polygon points="100,-15 400,-15 380,15 120,15" fill="url(#laserBeamGrad)" opacity="0.15"/>
  </g>

  <!-- Digital Data Stream Arrows along the sides -->
  <line x1="50" y1="100" x2="50" y2="400" stroke="#38BDF8" stroke-width="3" class="stream-line" opacity="0.8"/>
  <line x1="450" y1="400" x2="450" y2="100" stroke="#D4AF37" stroke-width="3" class="stream-line" opacity="0.8"/>

  <!-- Scanning Target Reticle in Corner -->
  <g class="target-pulse">
    <circle cx="360" cy="140" r="20" fill="none" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="360" cy="140" r="6" fill="#00D2FF"/>
  </g>

  <!-- OCR Status Badge in Top Bar -->
  <g transform="translate(180, 36)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#0B192C" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="14" cy="12" r="4" fill="#10B981"/>
    <text x="75" y="16" font-family="'Inter', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8" text-anchor="middle">OCR SCANNING LIVE</text>
  </g>
</svg>
